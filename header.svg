<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="auto">
  <defs>
    <!-- Native SMIL Shimmering Metallic Gradient Animation (100% Camo Supported) -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
      <animate attributeName="x1" values="-100%; 100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Deep Luxury Matte Background Canvas -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Floating Top Laser Beam -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
      <animate attributeName="x1" values="-100%; 100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="900" height="220" rx="14" fill="url(#bg-grad)" />
  <rect x="0.5" y="0.5" width="899" height="219" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Animated Top Hairline Laser Beam -->
  <line x1="40" y1="1" x2="860" y2="1" stroke="url(#laser)" stroke-width="2" />

  <!-- Pre-Header Status Row -->
  <g transform="translate(56, 48)">
    <!-- Pulsing Live Operational Dot -->
    <circle cx="6" cy="6" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', monospace" font-size="11" font-weight="600" letter-spacing="3px" fill="#38bdf8">
      PRODUCT OWNER &amp; SYSTEMS ARCHITECT
    </text>
  </g>

  <!-- Main Identity Headline -->
  <g transform="translate(56, 106)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5px" fill="#ffffff">
      BONIFASIUS <tspan fill="url(#shimmer)">GINTING</tspan>
    </text>
  </g>

  <!-- Hairline Divider with Shimmer Accent -->
  <line x1="56" y1="132" x2="844" y2="132" stroke="#1e293b" stroke-width="1" />
  <line x1="56" y1="132" x2="360" y2="132" stroke="url(#shimmer)" stroke-width="1.2" opacity="0.7" />

  <!-- Subtitle Affiliations -->
  <g transform="translate(56, 172)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      Bank Central Asia (BCA) &bull; Apple Developer Academy (Cohort 5) &bull; BINUS University (GPA 3.90)
    </text>
  </g>
</svg>
